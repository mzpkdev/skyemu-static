name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libgl-dev libopengl-dev libx11-dev libxcursor-dev libxi-dev
      - run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pnpm run build:skyemu
      - run: pnpm run test
      - run: pnpm run package:skyemu
      - run: |
          expected="$(sed -n 's/const defaultReleaseSha256 = "\([a-f0-9]*\)"/\1/p' src/index.ts)"
          actual="$(sha256sum release/SkyEmu-v5-linux-x64.zip | cut -d ' ' -f1)"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: skyemu-v5-linux-x64
          path: release/SkyEmu-v5-linux-x64.zip
          if-no-files-found: error
          retention-days: 90
      - run: gh release create "$GITHUB_REF_NAME" release/SkyEmu-v5-linux-x64.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish --access public
